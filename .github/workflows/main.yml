name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Dylib using Apple Clang
        run: |
          xcrun -sdk iphoneos clang -dynamiclib \
            -arch arm64 -arch arm64e \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -install_name @executable_path/VideoStarCustomTool.dylib \
            -framework UIKit -framework Foundation -framework PhotosUI -framework CoreImage -framework CoreGraphics \
            VideoStarCustomTool.m -o VideoStarCustomTool.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarCustomTool.dylib
          path: VideoStarCustomTool.dylib
